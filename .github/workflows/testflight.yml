name: TestFlight

# Builds the iPhone app + keyboard (ios/), signs it for the App Store and uploads it to TestFlight.
# Push any `testflight/**` branch to upload that commit. Needs an App Store Connect team key with the
# Admin role (secrets ASC_KEY_ID + ASC_KEY_P8, base64 of the .p8) so Xcode can use a cloud-managed
# distribution certificate and create the App IDs, App Group and profiles on its own. The issuer ID is
# the team's, shared with the notary key.
on:
  push:
    branches: ["testflight/**"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/LocalFlowiOS.xcarchive" >> "$GITHUB_ENV"

      - run: brew install xcodegen
      - run: scripts/fetch-whisper.sh
      - run: cd ios && xcodegen generate

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8

      # Archive with an ad-hoc signature (keeps the App Group entitlements, needs no certificate);
      # the export step re-signs with a cloud-managed distribution certificate, so CI never creates
      # a development certificate (the account is at its limit for those).
      - name: Check API key
        run: |
          head -1 "$ASC_KEY_PATH" | grep -q "BEGIN PRIVATE KEY" || { echo "ASC_KEY_P8 does not decode to a .p8 key"; exit 1; }
          echo "Key ID length: ${#ASC_KEY_ID}"
          pip3 install -q --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install -q pyjwt cryptography
          python3 - <<'PY'
          import jwt, os, time, urllib.request, urllib.error
          key = open(os.environ["ASC_KEY_PATH"]).read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=50", headers={"Authorization": "Bearer " + tok})
          try:
              body = urllib.request.urlopen(req).read().decode()
              import json
              ids = [d["attributes"]["identifier"] for d in json.loads(body)["data"]]
              print("API key works. Bundle IDs:", ids)
          except urllib.error.HTTPError as e:
              print("API key rejected:", e.code, e.read().decode()[:400])
              raise SystemExit(1)
          PY

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/LocalFlowiOS.xcodeproj \
            -scheme LocalFlowiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath build-ios \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tail -40

      - name: Export (App Store signing)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40

      - name: Save export logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/distlogs"
          find "$TMPDIR" /var/folders -name "*.xcdistributionlogs" -maxdepth 6 -exec cp -R {} "$RUNNER_TEMP/distlogs/" \; 2>/dev/null || true
          ls -R "$RUNNER_TEMP/distlogs" | head -50
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: distribution-logs
          path: ${{ runner.temp }}/distlogs

      - name: Check entitlements
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q -o ./*.ipa -d ipa
          APP="ipa/Payload/Local Flow.app"
          for BUNDLE in "$APP" "$APP/PlugIns/LocalFlowKeyboard.appex"; do
            echo "== $BUNDLE"
            codesign -d --entitlements - --xml "$BUNDLE" | plutil -p -
            codesign -d --entitlements - --xml "$BUNDLE" | grep -q group.com.jzone3.LocalFlow
          done

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
