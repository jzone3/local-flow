name: TestFlight

# Builds the iPhone app + keyboard (ios/), signs it for the App Store and uploads it to TestFlight.
# Push any `testflight/**` branch to upload that commit. Uses the App Store Connect API key the Mac
# release notarizes with; it needs the Admin role so Xcode can create the distribution certificate,
# the App IDs and the App Group on its own.
on:
  push:
    branches: ["testflight/**"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/LocalFlowiOS.xcarchive" >> "$GITHUB_ENV"

      - run: brew install xcodegen
      - run: scripts/fetch-whisper.sh
      - run: cd ios && xcodegen generate

      - name: API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: echo "$NOTARY_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"

      # Archive with an ad-hoc signature (keeps the App Group entitlements, needs no certificate);
      # the export step re-signs with a cloud-managed distribution certificate, so CI never creates
      # a development certificate (the account is at its limit for those).
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/LocalFlowiOS.xcodeproj \
            -scheme LocalFlowiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath build-ios \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tail -40

      - name: Export (App Store signing)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40

      - name: Check entitlements
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q -o ./*.ipa -d ipa
          APP="ipa/Payload/Local Flow.app"
          for BUNDLE in "$APP" "$APP/PlugIns/LocalFlowKeyboard.appex"; do
            echo "== $BUNDLE"
            codesign -d --entitlements - --xml "$BUNDLE" | plutil -p -
            codesign -d --entitlements - --xml "$BUNDLE" | grep -q group.com.jzone3.LocalFlow
          done

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
